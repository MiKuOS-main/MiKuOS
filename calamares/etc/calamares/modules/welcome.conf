# MiKuOS installer welcome requirements.
# Storage/ram floors are lowered so small or virtual disks are accepted,
# and the internet requirement is removed (offline installs are fine).
showReleaseNotesUrl: true

requirements:
    requiredStorage: 6
    requiredFreeStorage: 6
    requiredRam: 2.0

    check:
        - storage
        - ram
        - power
        - screen

    required:
        - storage
        - ram