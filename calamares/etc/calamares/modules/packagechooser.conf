# MiKuOS installer desktop choice.
mode: required

method: legacy

labels:
    step: "Desktop"

default: cosmic

items:
    - id: cosmic
      packages: [ cosmic ]
      name: COSMIC
      description: "<html>COSMIC is a modern Wayland desktop built with Rust, designed to be fast, smooth and responsive. It is the default desktop of MiKuOS and ships with the Hatsune Miku theme out of the box.<br/>
                    <br/>
                    Learn more at <a href=\"https://system76.com/cosmic\">system76.com/cosmic</a></html>"
      screenshot: "images/cosmic.jpg"

    - id: ""
      packages: []
      name: "No desktop"
      screenshot: "images/nodesktop.jpg"
      description: "A minimal system without a graphical desktop will be installed. This is great for servers or custom setups with window managers. The configuration can be changed after installation."