# MiKuOS installer welcome requirements.
# The storage check is disabled: Calamares misreports free space on the live
# medium, which falsely blocked installs even with plenty of disk free.
# RAM is the only hard requirement.
showReleaseNotesUrl: true

requirements:
    requiredRam: 2.0

    check:
        - ram
        - screen

    required:
        - ram