# MiKuOS partition layout.
# The UEFI-only fixed partitionLayout is removed so Calamares auto-creates
# a bootable layout for both EFI and BIOS, and manual partitioning is allowed.
efi:
    mountPoint: "/boot"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks2

defaultFileSystemType: "ext4"

availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - f2fs

showNotEncryptedBootMessage: false

allowManualPartitioning: true
initialSwapChoice: none